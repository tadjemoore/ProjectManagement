<div class="modal-overlay" id="createProjectModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Create New Project</h3>
            <button class="modal-close-btn" id="closeCreateProjectModalBtn">&times;</button>
        </div>
        <form id="createProjectForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="projectTitle" class="form-label required">Project Title</label>
                    <input type="text" id="projectTitle" class="form-input" placeholder="e.g., Q3 Analytics API Setup" required>
                </div>
                <div class="form-group">
                    <label for="projectDescription" class="form-label">Description</label>
                    <textarea id="projectDescription" class="form-input form-textarea" placeholder="Explain the project goal and key objectives..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="projectDueDate" class="form-label">Due Date</label>
                        <input type="date" id="projectDueDate" class="form-input">
                    </div>
                    <div class="form-group col-6">
                        <label class="form-label">Project Owner</label>
                        <div class="read-only-owner-badge" id="modalProjectOwnerDisplay">
                            <div class="avatar avatar-sm"></div>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Assign Project Members</label>
                    <div class="members-checkbox-grid" id="projectMembersCheckboxGrid"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Project Tasks (Optional)</label>
                    <p class="modal-instruction-text">Add tasks for this project here.</p>

                    <div id="projectSeedTasksContainer" class="project-seed-tasks">
                        <div class="project-seed-task-row">
                            <input type="text" class="form-input seed-task-title" placeholder="Task Title">
                            <input type="text" class="form-input seed-task-desc" placeholder="Task Description (Optional)">
                            <select class="form-select seed-task-assignee">
                                <option value="">Unassigned</option>
                            </select>
                            <select class="form-select seed-task-priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                            <input type="date" class="form-input seed-task-due-date">
                            <button type="button" class="btn btn-secondary btn-sm remove-seed-task-btn" title="Remove Task">&times;</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary btn-sm" id="addProjectSeedTaskBtn">
                        Add Task
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelCreateProjectBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Project</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="editProjectModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Edit Project</h3>
            <button class="modal-close-btn" id="closeEditProjectModalBtn">&times;</button>
        </div>

        <form id="editProjectForm">
            <input type="hidden" id="editProjectId">
            
            <div class="modal-body">
                
                <div class="form-group">
                    <label for="editProjectTitle" class="form-label required">Project Title</label>
                    <input type="text" id="editProjectTitle" class="form-input" placeholder="e.g., Q3 Analytics API Setup" required>
                </div>

                <div class="form-group">
                    <label for="editProjectDescription" class="form-label">Description</label>
                    <textarea id="editProjectDescription" class="form-input form-textarea" placeholder="Explain the project goal and key objectives..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="editProjectDueDate" class="form-label">Due Date</label>
                        <input type="date" id="editProjectDueDate" class="form-input">
                    </div>
                </div>

                <div class="form-group col-6">
                    <label class="form-label">Project Owner</label>
                    <div class="read-only-owner-badge" id="editModalProjectOwnerDisplay">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Assign Project Members</label>
                    <div class="members-check-box-grid" id="editProjectMembersCheckboxGrid"></div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelEditProjectBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="addTaskModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Add New Task</h3>
            <button class="modal-close-btn" id="closeAddTaskModalBtn">&times;</button>
        </div>
        <form id="addTaskForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="taskProjectSelect" class="form-label required">Project</label>
                    <select id="taskProjectSelect" class="form-select" required></select>
                </div>
                <div class="form-group">
                    <label for="taskTitle" class="form-label required">Task Title</label>
                    <input type="text" id="taskTitle" class="form-input" placeholder="e.g., Draft integration testing docs" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription" class="form-label">Description</label>
                    <textarea id="taskDescription" class="form-input form-textarea" placeholder="Provide details about what needs to be done..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group col-4">
                        <label for="taskAssigneeSelect" class="form-label">Assignee</label>
                        <select id="taskAssigneeSelect" class="form-select">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                    <div class="form-group col-4">
                        <label for="taskPrioritySelect" class="form-label required">Priority</label>
                        <select id="taskPrioritySelect" class="form-select" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group col-4">
                        <label for="taskDueDate" class="form-label">Due Date</label>
                        <input type="date" id="taskDueDate" class="form-input">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelAddTaskBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Task</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="taskDetailsModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Task Details</h3>
            <button class="modal-close-btn" id="closeTaskDetailsModalBtn">&times;</button>
        </div>
        <form id="taskDetailsForm">
            <input type="hidden" id="taskDetailsTaskId">

            <div class="modal-body" id="taskDetailsContent">
                <div class="form-row">
                <div class="form-group col-6">
                    <label class="form-label">Task</label>
                    <input type="text" id="taskDetailsTitleInput" class="form-input" readonly required>
                </div>

                <div class="form-group col-6">
                    <label class="form-label">Project</label>
                    <input type="text" id="taskDetailsProject" class="form-input" readonly>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea id="taskDetailsDescriptionInput" class="form-input form-textarea" readonly></textarea>
            </div>

            <div class="form-row">
                <div class="form-group col-4">
                    <label class="form-label">Assignee</label>
                    <select id="taskDetailsAssigneeSelect" class="form-select" disabled>
                        <option value="">Unassigned</option>
                    </select>
                </div>

                <div class="form-group col-4">
                    <label class="form-label">Status</label>
                    <select id="taskDetailsStatusSelect" class="form-select" disabled>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group col-4">
                    <label class="form-label">Priority</label>
                    <select id="taskDetailsPrioritySelect" class="form-select" disabled>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-4">
                    <label class="form-label">Due Date</label>
                    <input type="date" id="taskDetailsDueDateInput" class="form-input" readonly>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="closeTaskDetailsBtn">Close</button>
            <button type="button" class="btn btn-secondary" id="taskDetailsEditBtn">Edit Task</button>
            <button type="button" class="btn btn-secondary hidden" id="taskDetailsCancelEditBtn">Cancel Edit</button>
            <button type="submit" class="btn btn-primary hidden" id="taskDetailsSaveBtn">Save Changes</button>
        </div>
    </form>
</div>

<div class="modal-overlay" id="manageMembersModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Manage Project Members</h3>
            <button class="modal-close-btn" id="closeManageMembersModalBtn">&times;</button>
        </div>
        <form id="manageMembersForm">
            <input type="hidden" id="manageMembersProjectId">
            <div class="modal-body">
                <p class="modal-instruction-text">
                    Select users to assign to this project. Project members can be assigned tasks within this project.
                </p>
                <div class="members-checkbox-grid" id="manageMembersCheckboxGrid"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelManageMembersBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Members</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="manageRolesModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Assign User Role</h3>
            <button class="modal-close-btn" id="closeManageRolesModalBtn">&times;</button>
        </div>
        <form id="manageRolesForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="manageRolesUserSelect" class="form-label required">User</label>
                    <select id="manageRolesUserSelect" class="form-select" required></select>
                </div>
                <div class="form-group">
                    <label for="manageRolesSelect" class="form-label required">Role</label>
                    <select id="manageRolesSelect" class="form-select" required></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelManageRolesBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Role</button>
            </div>
        </form>
    </div>
</div>

<div id="toastNotification" class="toast-notification hidden">
    <i class="fa-solid fa-circle-check toast-icon"></i>
    <span class="toast-message">Project created successfully!</span>
</div>
