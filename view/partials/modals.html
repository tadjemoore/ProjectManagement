<div class="modal-overlay" id="createProjectModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Create New Project</h3>
            <button class="modal-close-btn" id="closeCreateProjectModalBtn">&times;</button>
        </div>
        <form id="createProjectForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="projectTitle" class="form-label required">Project Title</label>
                    <input type="text" id="projectTitle" class="form-input" placeholder="e.g., Q3 Analytics API Setup" required>
                </div>
                <div class="form-group">
                    <label for="projectDescription" class="form-label">Description</label>
                    <textarea id="projectDescription" class="form-input form-textarea" placeholder="Explain the project goal and key objectives..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="projectDueDate" class="form-label">Due Date</label>
                        <input type="date" id="projectDueDate" class="form-input">
                    </div>
                    <div class="form-group col-6">
                        <label class="form-label">Project Owner</label>
                        <div class="read-only-owner-badge" id="modalProjectOwnerDisplay">
                            <div class="avatar avatar-sm"></div>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Assign Project Members</label>
                    <div class="members-checkbox-grid" id="projectMembersCheckboxGrid"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelCreateProjectBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Project</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="addTaskModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Add New Task</h3>
            <button class="modal-close-btn" id="closeAddTaskModalBtn">&times;</button>
        </div>
        <form id="addTaskForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="taskProjectSelect" class="form-label required">Project</label>
                    <select id="taskProjectSelect" class="form-select" required></select>
                </div>
                <div class="form-group">
                    <label for="taskTitle" class="form-label required">Task Title</label>
                    <input type="text" id="taskTitle" class="form-input" placeholder="e.g., Draft integration testing docs" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription" class="form-label">Description</label>
                    <textarea id="taskDescription" class="form-input form-textarea" placeholder="Provide details about what needs to be done..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group col-4">
                        <label for="taskAssigneeSelect" class="form-label">Assignee</label>
                        <select id="taskAssigneeSelect" class="form-select">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                    <div class="form-group col-4">
                        <label for="taskPrioritySelect" class="form-label required">Priority</label>
                        <select id="taskPrioritySelect" class="form-select" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group col-4">
                        <label for="taskDueDate" class="form-label">Due Date</label>
                        <input type="date" id="taskDueDate" class="form-input">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelAddTaskBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Task</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="manageMembersModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Manage Project Members</h3>
            <button class="modal-close-btn" id="closeManageMembersModalBtn">&times;</button>
        </div>
        <form id="manageMembersForm">
            <input type="hidden" id="manageMembersProjectId">
            <div class="modal-body">
                <p class="modal-instruction-text">Select the team members participating in this project. Project members can be assigned tasks within this project.</p>
                <div class="members-checkbox-grid" id="manageMembersCheckboxGrid"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelManageMembersBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="manageRolesModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Assign User Role</h3>
            <button class="modal-close-btn" id="closeManageRolesModalBtn">&times;</button>
        </div>
        <form id="manageRolesForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="manageRolesUserSelect" class="form-label required">User</label>
                    <select id="manageRolesUserSelect" class="form-select" required></select>
                </div>
                <div class="form-group">
                    <label for="manageRolesSelect" class="form-label required">Role</label>
                    <select id="manageRolesSelect" class="form-select" required></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelManageRolesBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Role</button>
            </div>
        </form>
    </div>
</div>

<div id="toastNotification" class="toast-notification hidden">
    <i class="fa-solid fa-circle-check toast-icon"></i>
    <span class="toast-message">Project created successfully!</span>
</div>
