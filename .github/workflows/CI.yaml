name: Continuous Integration Build and Deployment
run-name: By @${{ github.actor }}

on:
  push:
    # branches:
    #   - 'deploy'
    branches-ignore:
      - 'main'
  workflow_dispatch:
 
# Prevent the action from running when a new branch is created.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'create' }}

jobs:
  variables:
    runs-on: ubuntu-latest

    outputs:
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
      RepositoryName: ${{ steps.repository.outputs.Name }}
      BranchName: ${{ steps.gitversion.outputs.branchName }}

    steps:
      - name: Get Repository Name
        id: repository
        run: |
          echo "Name=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT
           
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 #fetch-depth is needed for GitVersion
       
      # Install and calculate the new version with GitVersion  
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: 5.x
       
      - name: Determine Version
        id: gitversion # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@v0.9.7

  build-and-push-docker-image:
    runs-on: ubuntu-latest

    needs: variables

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
   
      - name: Build, tag, and push image to Docker Hub
        id: build
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REPOSITORY: rhino-pumps-app
          # DOCKER_REPOSITORY: ${{ needs.variables.outputs.RepositoryName }}
          IMAGE_TAG: ${{ needs.variables.outputs.Version }}
        run: |
          echo "Building and pushing Docker image: $DOCKER_USERNAME/$DOCKER_REPOSITORY:$IMAGE_TAG"  
          docker build -t $DOCKER_USERNAME/$DOCKER_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $DOCKER_USERNAME/$DOCKER_REPOSITORY:$IMAGE_TAG
    
